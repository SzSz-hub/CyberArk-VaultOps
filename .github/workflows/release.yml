name: Release

# jpackage can only build native artifacts for the OS it runs on, so each operating system
# is built on its own runner and the results are gathered into a single GitHub Release.
# Trigger by pushing a tag like v1.0.0, or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            classifier: windows-x64
          - os: ubuntu-latest
            classifier: linux-x64
          - os: macos-13
            classifier: macos-x64
          - os: macos-14
            classifier: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native app-image
        run: mvn -B -P native-package clean package

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-dev}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # Archive with the OS-native tool so executable bits / symlinks are preserved, then emit a checksum.
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "CyberArkVaultOps-${{ steps.ver.outputs.version }}-${{ matrix.classifier }}"
          Compress-Archive -Path "target/dist/CyberArk VaultOps" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii -NoNewline

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="CyberArkVaultOps-${{ steps.ver.outputs.version }}-${{ matrix.classifier }}"
          tar -czf "$name.tar.gz" -C "target/dist" "CyberArk VaultOps"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.classifier }}
          path: |
            CyberArkVaultOps-*.zip
            CyberArkVaultOps-*.zip.sha256
            CyberArkVaultOps-*.tar.gz
            CyberArkVaultOps-*.tar.gz.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine checksums
        run: cat artifacts/**/*.sha256 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/CyberArkVaultOps-*.zip
            artifacts/**/CyberArkVaultOps-*.tar.gz
            artifacts/**/*.sha256
            SHA256SUMS.txt
          generate_release_notes: true
