<?xml version="1.0" encoding="UTF-8"?>
<!--
  CyberArk VaultOps application icon (master source).

  This SVG mirrors the runtime-rendered icon in AppIcon.java. JavaFX cannot load SVG directly,
  so the app draws its window icon programmatically. Use this file to export raster assets for
  packaging (e.g. a Windows .ico for jpackage / launch4j):

    # PNG sizes
    inkscape app-icon.svg -w 256 -o icon-256.png
    # or with ImageMagick / magick:
    magick -background none app-icon.svg -resize 256x256 icon-256.png

    # Combine into a multi-resolution .ico
    magick icon-16.png icon-32.png icon-48.png icon-64.png icon-128.png icon-256.png app-icon.ico
-->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb0ff"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
  </defs>

  <!-- Vault panel -->
  <rect x="15.36" y="15.36" width="225.28" height="225.28" rx="56.32" ry="56.32" fill="url(#panel)"/>
  <rect x="15.36" y="15.36" width="225.28" height="225.28" rx="56.32" ry="56.32"
        fill="none" stroke="#4da3ff" stroke-opacity="0.55" stroke-width="5.12"/>

  <!-- Vault dial -->
  <circle cx="128" cy="128" r="76.8" fill="url(#dial)"/>
  <circle cx="128" cy="128" r="53.76" fill="none" stroke="#0d1830" stroke-opacity="0.85" stroke-width="7.68"/>

  <!-- Locking bolts -->
  <g fill="#eaf3ff">
    <circle cx="194.05" cy="128.00" r="7.17"/>
    <circle cx="174.70" cy="174.70" r="7.17"/>
    <circle cx="128.00" cy="194.05" r="7.17"/>
    <circle cx="81.30"  cy="174.70" r="7.17"/>
    <circle cx="61.95"  cy="128.00" r="7.17"/>
    <circle cx="81.30"  cy="81.30"  r="7.17"/>
    <circle cx="128.00" cy="61.95"  r="7.17"/>
    <circle cx="174.70" cy="81.30"  r="7.17"/>
  </g>

  <!-- Keyhole -->
  <g fill="#0d1830">
    <circle cx="128" cy="106.5" r="17.92"/>
    <polygon points="118.14,128 137.86,128 146.82,161.28 109.18,161.28"/>
  </g>
</svg>

